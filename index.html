<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablero Producción Kacrea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --surface-2:#F7F8F4; --ink:#15171C; --muted:#5D626C; --line:#DCDFD6; --line-2:#E9EBE5;
  --accent:#2D46D6; --accent-soft:#E3E7FF; --accent-ink:#FFFFFF;
  --ok:#1C7F52; --ok-bg:#DBF1E5; --warn:#9A6414; --warn-bg:#FAEED3; --bad:#B8322A; --bad-bg:#FBE2DE; --idle:#6B707A; --idle-bg:#ECEDE8;
  --g-gen:#F4F5F1; --g-eq:#FBF4E6; --g-op:#EEF1FF; --g-adm:#EEF7F1; --g-nt:#F4F5F1;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px -12px rgba(20,24,40,.12);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#171A20; --surface-2:#1C2027; --ink:#ECEEF2; --muted:#9BA1AC; --line:#2B3039; --line-2:#232730;
  --accent:#8497FF; --accent-soft:#222A52; --accent-ink:#0E1120;
  --ok:#52C58F; --ok-bg:#15301F; --warn:#E3AC4E; --warn-bg:#33280F; --bad:#F2766C; --bad-bg:#3A1A18; --idle:#949AA5; --idle-bg:#252930;
  --g-gen:#1A1D23; --g-eq:#262116; --g-op:#1B2033; --g-adm:#18261F; --g-nt:#1A1D23;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#171A20; --surface-2:#1C2027; --ink:#ECEEF2; --muted:#9BA1AC; --line:#2B3039; --line-2:#232730;
  --accent:#8497FF; --accent-soft:#222A52; --accent-ink:#0E1120;
  --ok:#52C58F; --ok-bg:#15301F; --warn:#E3AC4E; --warn-bg:#33280F; --bad:#F2766C; --bad-bg:#3A1A18; --idle:#949AA5; --idle-bg:#252930;
  --g-gen:#1A1D23; --g-eq:#262116; --g-op:#1B2033; --g-adm:#18261F; --g-nt:#1A1D23;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.45 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(26px,3.4vw,38px)/1.05 var(--display);letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.sync.ok i{background:var(--ok)} .sync.saving i{background:var(--warn)} .sync.error i,.sync.offline i{background:var(--bad)}
.today{font:500 12px var(--mono);color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--line-2);overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;background:var(--accent);border-radius:5px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* watch panels */
.watch{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:860px){.watch{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h2{font:600 15px var(--display);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.list{display:flex;flex-direction:column;max-height:228px;overflow:auto;margin:0 -6px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 6px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.li:hover{background:var(--surface-2)}
.li .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:12px;color:var(--muted)}
.li .when{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.sev{width:8px;height:8px;border-radius:50%}
.sev.s3{background:var(--bad)} .sev.s2{background:var(--warn)} .sev.s1{background:var(--idle)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:36px}
.field input,.field select{border:0;background:none;outline:none;height:34px;min-width:0}
.field input{width:180px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;padding:0 4px}
.sp{flex:1}
.btn{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.grp-toggle{display:inline-flex;gap:4px}
.grp-toggle button{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.grp-toggle button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* column panel */
.colpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.colpanel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.colpanel .field input{width:220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font-size:12px}
.cchip span{color:var(--muted);font-family:var(--mono);font-size:11px}
.cchip button{border:0;background:var(--idle-bg);border-radius:99px;padding:2px 8px;cursor:pointer;font-size:11px}
.cchip button.armed{background:var(--bad);color:#fff}

/* grid */
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:78vh;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:0;vertical-align:middle;background:var(--surface)}
thead th{position:sticky;z-index:3;font-weight:600;text-align:left;white-space:nowrap}
thead tr.g th{top:0;height:30px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:0 10px;color:var(--muted)}
thead tr.h th{top:30px;padding:8px 10px;font-size:12px;line-height:1.25;white-space:normal;vertical-align:bottom;box-shadow:0 1px 0 var(--line)}
th.gen,td.gen{background:var(--surface)} thead th.gen{background:var(--g-gen)}
thead th.op{background:var(--g-op)} thead th.eq{background:var(--g-eq)} thead tr.g th.eq{color:var(--warn)} thead th.adm{background:var(--g-adm)} thead th.nt{background:var(--g-nt)}
thead tr.g th.op{color:var(--accent)} thead tr.g th.adm{color:var(--ok)}
.stick{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line)}
thead .stick{z-index:5}
tr.mes td{background:var(--surface-2);font:600 13px var(--display);padding:10px 12px;position:sticky;left:0}
tr.mes td span{font:500 11px var(--mono);color:var(--muted);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
tbody tr.r:hover td,tbody tr.r:hover th{background:var(--surface-2)}
tr.r.flash th,tr.r.flash td{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){tr.r.flash th,tr.r.flash td{animation:none;background:var(--accent-soft)}}

.pj{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:8px 10px;width:290px}
.ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%),var(--line-2) 0);display:grid;place-items:center}
.ring b{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:500 10px var(--mono);font-variant-numeric:tabular-nums}
.pj .in.name{font-weight:600;font-size:14px;width:100%}
.meta{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:0 6px;margin-top:1px}
.tag{font:500 10.5px var(--mono);padding:1px 6px;border-radius:99px;white-space:nowrap}
.tag.s3{background:var(--bad-bg);color:var(--bad)} .tag.s2{background:var(--warn-bg);color:var(--warn)} .tag.s1{background:var(--idle-bg);color:var(--idle)}

.in{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px;height:32px;outline:none;width:150px}
.in:hover{border-color:var(--line)}
.in:focus{border-color:var(--accent);background:var(--surface)}
.in::placeholder{color:var(--muted);opacity:.55}
td>.in,td>label,td>select,td>.util{margin:4px 6px}
.in-date{width:132px;font-family:var(--mono);font-size:12px}
.in-date.late{color:var(--bad);font-weight:500}
.money{display:inline-flex;align-items:center;gap:2px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.money .in{width:104px;font-family:var(--mono);font-size:12.5px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:99px;padding:5px 24px 5px 10px;font-size:12px;font-weight:500;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;background-size:4px 4px;background-repeat:no-repeat;min-width:104px}
.pill.t-ok{background-color:var(--ok-bg);color:var(--ok)} .pill.t-warn{background-color:var(--warn-bg);color:var(--warn)}
.pill.t-bad{background-color:var(--bad-bg);color:var(--bad)} .pill.t-idle{background-color:var(--idle-bg);color:var(--idle)}
.pill option{background:var(--surface);color:var(--ink)}
.util{display:inline-block;font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:110px;text-align:right;padding:6px}
.util.pos{color:var(--ok)} .util.neg{color:var(--bad)} .util small{color:var(--muted);font-weight:400;margin-left:4px}
.act{padding:0 8px}
.del{border:1px solid transparent;background:none;color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;white-space:nowrap}
.del:hover{border-color:var(--line)}
.del.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.state{padding:40px 16px;text-align:center;color:var(--muted)}

/* suppliers */
.prov{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.prov{grid-template-columns:1fr}}
.pcat{display:flex;flex-direction:column;gap:10px}
.pcat h3{font:600 16px var(--display);margin:0}
.pcat .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.sup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sup .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sup .hd b{font:600 15px var(--display)}
.sup .hd span{font:500 12px var(--mono);color:var(--muted)}
.sup ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sup li{display:grid;grid-template-columns:96px 1fr auto;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);font-size:13px;align-items:center}
.sup li .dt{font:500 12px var(--mono);color:var(--muted)}
.sup.none{border-style:dashed}
.eqsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.eqsum .tag{font-size:12px;padding:4px 10px}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .hd b{font:600 17px var(--display)}
.pcard .hd button{font-size:12px}
.load{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-2);border-radius:8px;overflow:hidden}
.load div{background:var(--surface-2);padding:6px 8px;display:flex;flex-direction:column}
.load div span{font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.load div b{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.role{font:500 11px var(--mono);padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.role.z{background:var(--idle-bg);color:var(--idle)}
.pcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:220px;overflow:auto}
.pcard li{display:grid;grid-template-columns:80px 1fr auto;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);font-size:13px;align-items:center}
.pcard li .dt{font:500 12px var(--mono);color:var(--muted)}
.pcard li .rl{font:500 10.5px var(--mono);color:var(--muted)}
.lbar{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.lbar b{display:block;height:100%;border-radius:6px}
body.ro #btnAdd,body.ro #btnCol,body.ro .del,body.ro #colPanel{display:none!important}
body.ro .in,body.ro .pill{pointer-events:none}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;box-shadow:var(--shadow)}
</style>
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.gate-card h2{font:700 26px/1.1 var(--display);margin:0}
.gate-card p{color:var(--muted);font-size:13.5px;margin:0 0 6px}
.gate-card input{width:100%;padding:14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;letter-spacing:.3em;text-align:center}
.gate-card input:focus{border-color:var(--accent);outline:none}
.gate-card small{color:var(--bad);font-size:13px;text-align:center}
.seed{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Kacrea · Producción de eventos</div>
      <h1>Proyectos <em>por venir</em></h1>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="today" id="today"></span>
      <span class="sync" id="sync"><i></i><span>Conectando…</span></span>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="kpis" id="kpis" aria-label="Resumen"></section>

  <section class="watch">
    <div class="panel"><h2>Requiere atención <small id="alertCount"></small></h2><div class="list" id="alerts"></div></div>
    <div class="panel"><h2>Próximas reuniones <small>14 días</small></h2><div class="list" id="meets"></div></div>
  </section>

  <section class="tools">
    <div class="tabs" role="group" aria-label="Vista">
      <button id="tabTabla" aria-pressed="true">Seguimiento</button>
      <button id="tabEq" aria-pressed="false">Equipo</button>
      <button id="tabProv" aria-pressed="false">Proveedores</button>
    </div>
    <label class="field"><span aria-hidden="true" style="color:var(--muted)">⌕</span><input id="q" type="search" placeholder="Buscar proyecto, marca, persona"></label>
    <label class="field"><select id="fMes" aria-label="Mes"></select></label>
    <label class="field"><select id="fMarca" aria-label="Marca"></select></label>
    <label class="field"><select id="fResp" aria-label="Responsable"></select></label>
    <label class="chk"><input type="checkbox" id="fAlert"> Solo con alertas</label>
    <label class="chk"><input type="checkbox" id="fPast" checked> Ocultar realizados</label>
    <span class="sp"></span>
    <div class="grp-toggle" id="grpToggle">
      <button data-g="eq" aria-pressed="true">Responsables</button>
      <button data-g="op" aria-pressed="true">Operativo</button>
      <button data-g="adm" aria-pressed="true">Administrativo</button>
    </div>
    <button class="btn" id="btnCol">+ Columna</button>
    <button class="btn pri" id="btnAdd">+ Proyecto</button>
  </section>

  <section class="colpanel" id="colPanel" hidden>
    <div class="row">
      <label class="field"><input id="cLabel" placeholder="Nombre de la columna (ej. Permisos)"></label>
      <label class="field"><select id="cType">
        <option value="step">Estatus (Pendiente / En proceso / Listo)</option>
        <option value="yn">Sí / No</option>
        <option value="text">Texto</option>
        <option value="date">Fecha</option>
        <option value="money">Monto ($)</option>
      </select></label>
      <label class="field"><select id="cGroup">
        <option value="op">En Seguimiento operativo</option>
        <option value="adm">En Administrativo</option>
      </select></label>
      <button class="btn pri" id="cAdd">Agregar columna</button>
      <button class="btn" id="cClose">Cerrar</button>
    </div>
    <div class="chips" id="cList"></div>
  </section>

  <section id="viewTabla">
    <div class="gridwrap" id="gridwrap"><div class="state">Cargando proyectos…</div></div>
  </section>
  <section id="viewEq" hidden><div id="eq"></div></section>
  <section id="viewProv" hidden><div class="prov" id="prov"></div></section>
</div>
<div id="dls"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const STEP=["Pendiente","En proceso","Listo","N/A"];
const PPTO=["Por enviar","Por aprobar","Aprobado","Rechazado"];
const YN=["No","Sí"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MES3=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const GROUPS={gen:"Proyecto",eq:"Responsables",op:"Seguimiento operativo",adm:"Administrativo · comercial",nt:""};
const COLS=[
 {key:"fechaInicio",label:"Desde",type:"date",group:"gen"},
 {key:"fechaFin",label:"Hasta",type:"date",group:"gen"},
 {key:"evento",label:"Evento",type:"text",group:"gen",w:190},
 {key:"marca",label:"Marca",type:"text",group:"gen",list:1,w:140},
 {key:"servicio",label:"Servicio",type:"text",group:"gen",w:230},
 {key:"solicitante",label:"Solicitado por (cliente)",type:"text",group:"gen",list:1,w:170},
 {key:"receptor",label:"Recibido por (Kacrea)",type:"text",group:"gen",list:1,w:150},
 {key:"respOp",label:"1 · Operativo",type:"people",group:"eq"},
 {key:"respCre",label:"2 · Creativo",type:"people",group:"eq"},
 {key:"respDis",label:"3 · Diseño",type:"people",group:"eq"},
 {key:"respAdm",label:"4 · Administrativo",type:"people",group:"eq"},
 {key:"venue",label:"Venue",type:"step",group:"op"},
 {key:"concepto",label:"Concepto",type:"step",group:"op"},
 {key:"distribucion",label:"Distribución de espacios",type:"step",group:"op"},
 {key:"lookfeel",label:"Look & Feel y render",type:"step",group:"op"},
 {key:"pptoEjecEstado",label:"Estatus PPTO ejecución",type:"step",group:"op"},
 {key:"provTecnico",label:"Proveedor pantalla · sonido · luces · hierros",type:"text",group:"op",list:1,w:170},
 {key:"provImpresion",label:"Proveedor impresión · corpóreos · MDF",type:"text",group:"op",list:1,w:170},
 {key:"ultReunion",label:"Última reunión",type:"date",group:"op"},
 {key:"proxReunion",label:"Próxima reunión",type:"date",group:"op"},
 {key:"pptoCliente",label:"PPTO cliente",type:"sel",opts:PPTO,group:"adm"},
 {key:"odc",label:"ODC",type:"yn",group:"adm"},
 {key:"factura",label:"Factura",type:"yn",group:"adm"},
 {key:"montoFactura",label:"Monto factura",type:"money",group:"adm"},
 {key:"costosEst",label:"Costos estimados",type:"money",group:"adm"},
 {key:"utilidad",label:"Utilidad neta estimada",type:"calc",group:"adm"},
 {key:"notas",label:"Notas",type:"text",group:"nt",w:240}
];
const ROLES=[["respOp","Operativo","Op"],["respCre","Creativo","Cre"],["respDis","Diseño","Dis"],["respAdm","Administrativo","Adm"]];
const people=v=>String(v||"").split(/[,;\/]| y /).map(x=>x.trim()).filter(Boolean);
const teamOf=p=>{const o=[];for(const[k,,ab]of ROLES)for(const n of people(p[k]))o.push({n,k,ab});return o;};
const STEPS=[["team","team"],["venue","s"],["concepto","s"],["distribucion","s"],["lookfeel","s"],["pptoEjecEstado","s"],["provTecnico","t"],["provImpresion","t"]];

const S={projects:new Map(),custom:[],db:null,loaded:false,offline:false,view:"tabla",
  f:{q:"",mes:"all",marca:"all",resp:"all",alerts:false,past:true},hidden:{eq:false,op:false,adm:false},pending:false,saving:0,focusNew:null};
try{const h=JSON.parse(localStorage.getItem("kc-hidden")||"null");if(h)S.hidden=Object.assign(S.hidden,h);}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const T0=Date.parse(TODAY+"T00:00:00");
const daysTo=iso=>iso?Math.round((Date.parse(iso+"T00:00:00")-T0)/864e5):null;
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("es-VE");
const num=v=>typeof v==="number"&&isFinite(v)?v:null;
function dLabel(iso){if(!iso)return "";const[y,m,d]=iso.split("-");return `${d} ${MES3[+m-1]}`;}
function rangeLabel(p){const a=p.fechaInicio,b=p.fechaFin;if(!a)return "Fecha por definir";if(!b||b===a)return dLabel(a);
  const[,ma,da]=a.split("-"),[,mb,db]=b.split("-");return ma===mb?`${da}–${db} ${MES3[+ma-1]}`:`${dLabel(a)} – ${dLabel(b)}`;}
const endOf=p=>p.fechaFin||p.fechaInicio;
const isPast=p=>!!endOf(p)&&endOf(p)<TODAY;
function getVal(p,k){return k.startsWith("custom.")?(p.custom||{})[k.slice(7)]:p[k];}
function tone(v){return {"Listo":"ok","Aprobado":"ok","Sí":"ok","N/A":"idle","En proceso":"warn","Por aprobar":"warn","Rechazado":"bad"}[v]||"idle";}
function progress(p){let d=0;for(const[k,t]of STEPS){const v=p[k];if(t==="team"){if(ROLES.every(([rk])=>people(p[rk]).length))d++;continue;}if(t==="t"?(v&&String(v).trim()):(v==="Listo"||v==="N/A"))d++;}return {done:d,pct:Math.round(d/STEPS.length*100)};}
function util(p){const m=num(p.montoFactura),c=num(p.costosEst);if(m===null||c===null)return null;return {u:m-c,mg:m?((m-c)/m*100):0};}
function alertsOf(p){
  const out=[],d=daysTo(p.fechaInicio),pr=progress(p).pct,past=isPast(p);
  if(!past){
    if(d!==null&&d<=7&&pr<100)out.push({s:3,t:d<=0?`En curso · avance ${pr}%`:`Faltan ${d} días · avance ${pr}%`});
    else if(d!==null&&d<=21&&pr<60)out.push({s:2,t:`Evento en ${d} días · avance ${pr}%`});
    if(d!==null&&d<=14&&p.pptoCliente!=="Aprobado")out.push({s:3,t:`PPTO cliente ${String(p.pptoCliente||"Por enviar").toLowerCase()} a ${Math.max(d,0)} días`});
    if(p.proxReunion&&p.proxReunion<TODAY)out.push({s:2,t:"Próxima reunión vencida"});
    if(!p.proxReunion&&d!==null&&d<=30)out.push({s:1,t:"Sin próxima reunión"});
    if(!p.fechaInicio)out.push({s:1,t:"Fecha por definir"});
    const miss=ROLES.filter(([rk])=>!people(p[rk]).length).map(r=>r[1].toLowerCase());
    if(miss.length&&(d===null||d<=30))out.push({s:miss.length===4?2:1,t:miss.length===4?"Sin responsables asignados":"Falta responsable "+miss.join(", ")});
  }
  if(p.pptoCliente==="Aprobado"&&p.odc!=="Sí")out.push({s:2,t:"PPTO aprobado sin ODC"});
  if(past&&p.factura!=="Sí"&&p.pptoCliente==="Aprobado")out.push({s:3,t:"Realizado sin facturar"});
  return out.sort((a,b)=>b.s-a.s);
}
function sorted(list){return list.sort((a,b)=>{const x=a.fechaInicio||"9999",y=b.fechaInicio||"9999";return x<y?-1:x>y?1:String(a.proyecto||"").localeCompare(String(b.proyecto||""),"es");});}
function filtered(){
  const q=S.f.q.toLowerCase();
  return sorted([...S.projects.values()].filter(p=>{
    if(S.f.past&&isPast(p))return false;
    if(S.f.mes!=="all"&&(p.fechaInicio?p.fechaInicio.slice(0,7):"none")!==S.f.mes)return false;
    if(S.f.marca!=="all"&&(p.marca||"")!==S.f.marca)return false;
    if(S.f.alerts&&!alertsOf(p).length)return false;
    if(S.f.resp!=="all"){const t=teamOf(p);if(S.f.resp==="__none"?t.length>=4&&ROLES.every(([rk])=>people(p[rk]).length):!t.some(x=>x.n===S.f.resp))return false;}
    if(q){const h=[p.proyecto,p.evento,p.marca,p.solicitante,p.receptor,p.respOp,p.respCre,p.respDis,p.respAdm,p.provTecnico,p.provImpresion].join(" ").toLowerCase();if(!h.includes(q))return false;}
    return true;
  }));
}
function colsVisible(){
  const cus=S.custom.map(c=>({key:"custom."+c.id,label:c.label,type:c.type,group:c.group,custom:1}));
  const out=[];
  for(const g of ["gen","eq","op","adm","nt"]){if(S.hidden[g])continue;out.push(...COLS.filter(c=>c.group===g),...cus.filter(c=>c.group===g));}
  return out;
}

/* ---------- rendering ---------- */
function setSync(k,t){const el=$("#sync");el.className="sync "+k;el.querySelector("span").textContent=t;}
function updSync(){if(S.offline)return;if(S.ro){setSync("error","Solo lectura");return;}if(S.saving>0)setSync("saving","Guardando…");else setSync("ok","Sincronizado");}
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200);}

function renderFilters(){
  const all=[...S.projects.values()];
  const meses=[...new Set(all.map(p=>p.fechaInicio?p.fechaInicio.slice(0,7):"none"))].sort();
  const fm=$("#fMes");fm.innerHTML=`<option value="all">Todos los meses</option>`+meses.map(m=>`<option value="${m}">${m==="none"?"Sin fecha":MESES[+m.slice(5)-1].replace(/^./,c=>c.toUpperCase())+" "+m.slice(0,4)}</option>`).join("");
  fm.value=meses.includes(S.f.mes)?S.f.mes:"all";S.f.mes=fm.value;
  const marcas=[...new Set(all.map(p=>p.marca).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  const fb=$("#fMarca");fb.innerHTML=`<option value="all">Todas las marcas</option>`+marcas.map(m=>`<option>${esc(m)}</option>`).join("");
  fb.value=marcas.includes(S.f.marca)?S.f.marca:"all";S.f.marca=fb.value;
  const ppl=[...new Set(all.flatMap(p=>teamOf(p).map(x=>x.n)))].sort((a,b)=>a.localeCompare(b,"es"));
  const fr=$("#fResp");fr.innerHTML=`<option value="all">Todo el equipo</option><option value="__none">Con roles sin asignar</option>`+ppl.map(n=>`<option>${esc(n)}</option>`).join("");
  fr.value=(S.f.resp==="__none"||ppl.includes(S.f.resp))?S.f.resp:"all";S.f.resp=fr.value;
  const lists={people:ppl};for(const c of COLS.filter(c=>c.list))lists[c.key]=[...new Set(all.map(p=>p[c.key]).filter(Boolean))].sort();
  $("#dls").innerHTML=Object.entries(lists).map(([k,v])=>`<datalist id="dl-${k}">${v.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`).join("");
}

function renderSummary(){
  const list=filtered();
  const n=list.length, next30=list.filter(p=>{const d=daysTo(p.fechaInicio);return d!==null&&d>=0&&d<=30;}).length;
  const avg=n?Math.round(list.reduce((s,p)=>s+progress(p).pct,0)/n):0;
  const apr=list.filter(p=>p.pptoCliente==="Aprobado").length, porApr=list.filter(p=>p.pptoCliente==="Por aprobar").length, porEnv=list.filter(p=>!p.pptoCliente||p.pptoCliente==="Por enviar").length;
  const odc=list.filter(p=>p.pptoCliente==="Aprobado"&&p.odc==="Sí").length;
  const fact=list.filter(p=>p.factura==="Sí").reduce((s,p)=>s+(num(p.montoFactura)||0),0);
  const porFact=list.filter(p=>p.factura!=="Sí").reduce((s,p)=>s+(num(p.montoFactura)||0),0);
  let uSum=0,mSum=0,uN=0;for(const p of list){const u=util(p);if(u){uSum+=u.u;mSum+=num(p.montoFactura);uN++;}}
  const k=(l,v,s,extra="")=>`<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span>${extra}<span class="s">${s}</span></div>`;
  $("#kpis").innerHTML=
    k("Proyectos",n,`${next30} en los próximos 30 días`)+
    k("Avance operativo",avg+"%","promedio de 8 pasos",`<div class="bar"><b style="width:${avg}%"></b></div>`)+
    k("PPTO aprobados",`${apr}<span style="font-size:15px;color:var(--muted)">/${n}</span>`,`${porApr} por aprobar · ${porEnv} por enviar`)+
    k("ODC recibidas",`${odc}<span style="font-size:15px;color:var(--muted)">/${apr}</span>`,"de los PPTO aprobados")+
    k("Facturado",money(fact),`Por facturar: ${money(porFact)}`)+
    k("Utilidad neta est.",uN?money(uSum):"—",uN?`margen ${Math.round(uSum/mSum*100)}% · ${uN} con cifras`:"carga monto y costos");
  // alerts
  const al=[];for(const p of list)for(const a of alertsOf(p))al.push({p,a});
  al.sort((x,y)=>y.a.s-x.a.s||(x.p.fechaInicio||"9").localeCompare(y.p.fechaInicio||"9"));
  $("#alertCount").textContent=al.length?`${al.length} alertas`:"";
  $("#alerts").innerHTML=al.length?al.map(({p,a})=>`<button class="li" data-go="${esc(p.id)}"><span class="sev s${a.s}"></span><span><div class="n">${esc(p.proyecto||"Sin nombre")}</div><div class="d">${esc(a.t)}</div></span><span class="when">${esc(rangeLabel(p))}</span></button>`).join(""):`<div class="empty">Nada pendiente con los filtros actuales.</div>`;
  const ms=list.filter(p=>p.proxReunion&&daysTo(p.proxReunion)<=14).sort((a,b)=>a.proxReunion.localeCompare(b.proxReunion));
  $("#meets").innerHTML=ms.length?ms.map(p=>{const d=daysTo(p.proxReunion);const w=d<0?`vencida (${-d}d)`:d===0?"hoy":d===1?"mañana":`en ${d} días`;
    return `<button class="li" data-go="${esc(p.id)}"><span class="sev ${d<0?"s3":d<=2?"s2":"s1"}"></span><span><div class="n">${esc(p.proyecto||"Sin nombre")}</div><div class="d">${esc(p.marca||"")}${p.respOp?" · Op: "+esc(p.respOp):""}</div></span><span class="when">${dLabel(p.proxReunion)} · ${w}</span></button>`;}).join(""):`<div class="empty">Sin reuniones agendadas en los próximos 14 días.</div>`;
}

function cellHTML(c,p){
  const h=cellHTML0(c,p);return S.ro?h.replace(/<(input|select) /g,"<$1 disabled "):h;}
function cellHTML0(c,p){
  const v=getVal(p,c.key),k=esc(c.key);
  switch(c.type){
    case "date":{const late=c.key==="proxReunion"&&v&&v<TODAY&&!isPast(p);return `<input type="date" class="in in-date${late?" late":""}" data-k="${k}" value="${esc(v||"")}" aria-label="${esc(c.label)}">`;}
    case "money":return `<label class="money"><span>$</span><input type="number" min="0" step="any" inputmode="decimal" class="in" data-k="${k}" value="${v??""}" placeholder="0" aria-label="${esc(c.label)}"></label>`;
    case "step":case "yn":case "sel":{const o=c.type==="step"?STEP:c.type==="yn"?YN:c.opts;const val=o.includes(v)?v:o[0];
      return `<select class="pill t-${tone(val)}" data-k="${k}" aria-label="${esc(c.label)}">${o.map(x=>`<option${x===val?" selected":""}>${x}</option>`).join("")}</select>`;}
    case "people":return `<input class="in" data-k="${k}" value="${esc(v??"")}" placeholder="Asignar" style="width:150px" list="dl-people" aria-label="${esc(c.label)}" title="Varias personas: sepáralas con coma">`;
    case "calc":return `<span class="util" data-util>${utilHTML(p)}</span>`;
    default:return `<input class="in" data-k="${k}" value="${esc(v??"")}" placeholder="—" style="width:${c.w||150}px"${c.list?` list="dl-${k}"`:""} aria-label="${esc(c.label)}">`;
  }
}
function utilHTML(p){const u=util(p);if(!u)return `<span style="color:var(--muted)">—</span>`;return `${money(u.u)}<small>${Math.round(u.mg)}%</small>`;}
function utilClass(p){const u=util(p);return "util"+(u?(u.u>=0?" pos":" neg"):"");}
function ringHTML(p){const pr=progress(p);const col=pr.pct===100?"var(--ok)":"var(--accent)";return `<span class="ring" style="--p:${pr.pct};--rc:${col}" title="${pr.done} de 8 pasos operativos"><b>${pr.done}/8</b></span>`;}
function metaHTML(p){const al=alertsOf(p);const top=al[0];return `<span>${esc(p.marca||"Sin marca")}</span><span>${esc(rangeLabel(p))}</span>${top?`<span class="tag s${top.s}" title="${esc(al.map(a=>a.t).join(" · "))}">${esc(top.t)}${al.length>1?` +${al.length-1}`:""}</span>`:""}`;}

function renderTable(){
  const wrap=$("#gridwrap");
  if(!S.loaded&&!S.offline){wrap.innerHTML=`<div class="state">Cargando proyectos…</div>`;return;}
  const list=filtered(),cols=colsVisible();
  if(!S.projects.size){wrap.innerHTML=`<div class="state">Todavía no hay proyectos. Usa “+ Proyecto” para agregar el primero.</div>`;return;}
  if(!list.length){wrap.innerHTML=`<div class="state">Ningún proyecto coincide con los filtros.</div>`;return;}
  const grpSpans=[];for(const c of cols){const last=grpSpans[grpSpans.length-1];if(last&&last.g===c.group)last.n++;else grpSpans.push({g:c.group,n:1});}
  let h=`<table><thead><tr class="g"><th class="stick gen" rowspan="2" style="vertical-align:bottom;padding:8px 10px;font:600 12px var(--body);letter-spacing:0;text-transform:none;color:var(--ink)">Proyecto</th>`;
  h+=grpSpans.map(s=>`<th class="${s.g}" colspan="${s.n}">${GROUPS[s.g]}</th>`).join("")+`<th class="gen" rowspan="2"></th></tr><tr class="h">`;
  h+=cols.map(c=>`<th class="${c.group}">${esc(c.label)}${c.custom?` <span style="color:var(--muted);font-weight:400">·</span>`:""}</th>`).join("")+`</tr></thead><tbody>`;
  let mes=null;const count={};for(const p of list){const m=p.fechaInicio?p.fechaInicio.slice(0,7):"none";count[m]=(count[m]||0)+1;}
  for(const p of list){
    const m=p.fechaInicio?p.fechaInicio.slice(0,7):"none";
    if(m!==mes){mes=m;const name=m==="none"?"Fecha por definir":MESES[+m.slice(5)-1].replace(/^./,c=>c.toUpperCase())+" "+m.slice(0,4);
      h+=`<tr class="mes"><td colspan="${cols.length+2}">${name}<span>${count[m]} proyecto${count[m]>1?"s":""}</span></td></tr>`;}
    h+=`<tr class="r" data-id="${esc(p.id)}"><th class="stick gen" scope="row"><div class="pj">${ringHTML(p)}<div><input class="in name" data-k="proyecto"${S.ro?" disabled":""} value="${esc(p.proyecto||"")}" placeholder="Nombre del proyecto" aria-label="Proyecto"><div class="meta">${metaHTML(p)}</div></div></div></th>`;
    h+=cols.map(c=>`<td class="${c.group}">${cellHTML(c,p)}</td>`).join("");
    h+=`<td class="act"><button class="del" data-del>Eliminar</button></td></tr>`;
  }
  h+=`</tbody></table>`;
  const sx=wrap.scrollLeft,sy=wrap.scrollTop;
  wrap.innerHTML=h;wrap.scrollLeft=sx;wrap.scrollTop=sy;
  wrap.querySelectorAll("[data-util]").forEach(el=>{const p=S.projects.get(el.closest("tr").dataset.id);el.className=utilClass(p);});
  if(S.focusNew){const inp=wrap.querySelector(`tr[data-id="${CSS.escape(S.focusNew)}"] [data-k="proyecto"]`);if(inp){inp.focus();inp.select();inp.closest("tr").scrollIntoView({block:"center"});}S.focusNew=null;}
}
function patchRow(id){
  const tr=$("#gridwrap").querySelector(`tr[data-id="${CSS.escape(id)}"]`);const p=S.projects.get(id);if(!tr||!p)return;
  tr.querySelectorAll("[data-k]").forEach(el=>{
    if(el!==document.activeElement){const v=getVal(p,el.dataset.k);
      if(el.tagName==="SELECT"){if(v&&[...el.options].some(o=>o.value===v))el.value=v;}
      else el.value=v??"";}
    if(el.tagName==="SELECT")el.className="pill t-"+tone(el.value);
    if(el.dataset.k==="proxReunion")el.classList.toggle("late",!!(el.value&&el.value<TODAY&&!isPast(p)));
  });
  tr.querySelector(".ring").outerHTML=ringHTML(p);
  tr.querySelector(".meta").innerHTML=metaHTML(p);
  const u=tr.querySelector("[data-util]");if(u){u.innerHTML=utilHTML(p);u.className=utilClass(p);}
}
const inGrid=()=>{const a=document.activeElement;return a&&$("#gridwrap").contains(a)&&a.matches("input,select");};

function renderProv(){
  const list=filtered().filter(p=>!isPast(p));
  const cats=[["provTecnico","Pantalla · sonido · iluminación · hierros"],["provImpresion","Impresiones · corpóreos · MDF"]];
  $("#prov").innerHTML=cats.map(([k,label])=>{
    const map=new Map();const none=[];
    for(const p of list){const names=String(p[k]||"").split(/[,;]/).map(s=>s.trim()).filter(Boolean);if(!names.length)none.push(p);for(const n of names){if(!map.has(n))map.set(n,[]);map.get(n).push(p);}}
    const sups=[...map.entries()].sort((a,b)=>b[1].length-a[1].length);
    const card=(name,ps,cls="")=>{sorted(ps);
      const clash=new Set();for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j];if(a.fechaInicio&&b.fechaInicio&&a.fechaInicio<=endOf(b)&&b.fechaInicio<=endOf(a)){clash.add(a.id);clash.add(b.id);}}
      return `<div class="sup ${cls}"><div class="hd"><b>${esc(name)}</b><span>${ps.length} proyecto${ps.length!==1?"s":""}${clash.size?` · <span style="color:var(--warn)">${clash.size} en fechas simultáneas</span>`:""}</span></div><ul>${ps.map(p=>`<li><span class="dt">${esc(rangeLabel(p))}</span><span>${esc(p.proyecto||"")} <span style="color:var(--muted)">· ${esc(p.marca||"")}</span></span>${clash.has(p.id)?`<span class="tag s2">Simultáneo</span>`:"<span></span>"}</li>`).join("")}</ul></div>`;};
    return `<div class="pcat"><h3>${label}</h3><div class="sub">${sups.length} proveedores asignados · ${none.length} proyectos sin asignar</div>${none.length?card("Sin proveedor asignado",none,"none"):""}${sups.map(([n,ps])=>card(n,ps)).join("")}</div>`;
  }).join("");
}
function renderEq(){
  const list=filtered().filter(p=>!isPast(p));
  const map=new Map();
  for(const p of list)for(const t of teamOf(p)){if(!map.has(t.n))map.set(t.n,new Map());const m=map.get(t.n);if(!m.has(p.id))m.set(p.id,{p,roles:[]});m.get(p.id).roles.push(t.ab);}
  const miss=ROLES.map(([rk,lab])=>[lab,list.filter(p=>!people(p[rk]).length).length]);
  const rows=[...map.entries()].map(([n,m])=>{const items=sorted([...m.values()].map(x=>x.p)).map(p=>({p,roles:m.get(p.id).roles}));
    const n14=items.filter(x=>{const d=daysTo(x.p.fechaInicio);return d!==null&&d<=14;}).length;
    const al=items.filter(x=>alertsOf(x.p).some(a=>a.s>=2)).length;
    const avg=items.length?Math.round(items.reduce((s,x)=>s+progress(x.p).pct,0)/items.length):0;
    const rc={};for(const x of items)for(const r of x.roles)rc[r]=(rc[r]||0)+1;
    const clash=new Set();for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i].p,b=items[j].p;if(a.fechaInicio&&b.fechaInicio&&a.fechaInicio<=endOf(b)&&b.fechaInicio<=endOf(a)){clash.add(a.id);clash.add(b.id);}}
    return {n,items,n14,al,avg,rc,clash};}).sort((a,b)=>b.items.length-a.items.length||b.n14-a.n14);
  const max=Math.max(1,...rows.map(r=>r.items.length));
  const head=`<div class="eqsum">${miss.map(([l,c])=>`<span class="tag ${c?"s2":"s1"}">Sin ${l.toLowerCase()}: ${c}</span>`).join("")}<span class="tag s1">${rows.length} personas con proyectos activos</span></div>`;
  if(!rows.length){$("#eq").innerHTML=head+`<div class="state">Todavía no hay responsables asignados. Escríbelos en las columnas 1 · Operativo, 2 · Creativo, 3 · Diseño y 4 · Administrativo de la pestaña Seguimiento.</div>`;return;}
  $("#eq").innerHTML=head+`<div class="eqgrid">`+rows.map(r=>{const pct=Math.round(r.items.length/max*100);const col=r.n14>=4||r.clash.size>=4?"var(--bad)":r.n14>=2?"var(--warn)":"var(--ok)";
    return `<div class="pcard"><div class="hd"><div><b>${esc(r.n)}</b><div class="roles" style="margin-top:6px">${ROLES.map(([,lab,ab])=>`<span class="role${r.rc[ab]?"":" z"}">${lab} ${r.rc[ab]||0}</span>`).join("")}</div></div><button class="btn sm" data-fresp="${esc(r.n)}">Ver en tabla</button></div>
    <div class="lbar" title="Carga relativa al más cargado del equipo"><b style="width:${pct}%;background:${col}"></b></div>
    <div class="load"><div><span>Activos</span><b>${r.items.length}</b></div><div><span>≤14 días</span><b>${r.n14}</b></div><div><span>Con alertas</span><b>${r.al}</b></div><div><span>Avance</span><b>${r.avg}%</b></div></div>
    <ul>${r.items.map(x=>`<li><span class="dt">${esc(rangeLabel(x.p))}</span><span>${esc(x.p.proyecto||"")} <span class="rl">· ${x.roles.join("+")}</span></span>${r.clash.has(x.p.id)?`<span class="tag s2">Simultáneo</span>`:"<span></span>"}</li>`).join("")}</ul></div>`;}).join("")+`</div>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-fresp]");if(!b)return;S.f.resp=b.dataset.fresp;setView("tabla");});
function renderColPanel(){
  $("#cList").innerHTML=S.custom.length?S.custom.map(c=>`<span class="cchip">${esc(c.label)} <span>${{step:"estatus",yn:"sí/no",text:"texto",date:"fecha",money:"monto"}[c.type]} · ${c.group==="op"?"operativo":"admin."}</span><button data-cdel="${esc(c.id)}">Quitar</button></span>`).join(""):`<span class="empty">Aún no hay columnas personalizadas.</span>`;
}
function renderAll(){renderFilters();renderSummary();if(S.view==="tabla"){if(inGrid()){S.pending=true;[...S.projects.keys()].forEach(patchRow);}else renderTable();}else if(S.view==="eq")renderEq();else renderProv();renderColPanel();}

/* ---------- permisos ---------- */
function setReadOnly(msg){
  if(S.ro)return;S.ro=true;document.body.classList.add("ro");
  const b=$("#banner");b.hidden=false;b.className="banner err";
  b.textContent=msg||"Modo solo lectura: tu acceso a este tablero no permite guardar cambios. Lo que escribas no se guardará. Pídele al dueño del tablero acceso de edición.";
  if(S.server)S.projects=new Map(S.server);
  renderAll();
}
/* ---------- writes ---------- */
const chains=new Map();
function enqueue(key,fn){
  S.saving++;updSync();
  const run=()=>fn().catch(async e=>{if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn();}throw e;});
  const next=(chains.get(key)||Promise.resolve()).then(run).catch(e=>{console.warn(e);
    if(e&&e.code==="invalid_argument")setReadOnly("Tu cambio NO se guardó: tu acceso a este tablero es de solo lectura. Pídele al dueño del tablero acceso de edición; mientras tanto, el tablero queda bloqueado para que no se pierda más trabajo.");
    else if(e&&e.code==="quota_exceeded")toast("Se alcanzó el límite de registros del tablero.");
    else{setSync("error","Cambios sin guardar");const b=$("#banner");b.hidden=false;b.className="banner err";b.textContent="Un cambio no se pudo guardar (conexión). Recarga la página y verifica que tu último dato siga ahí antes de continuar.";}
  }).finally(()=>{S.saving--;updSync();});
  chains.set(key,next);return next;
}
function save(id,k,v){
  if(S.ro)return;
  const p=S.projects.get(id);if(!p)return;
  let next,patch;
  if(k.startsWith("custom.")){const cid=k.slice(7);next={...p,custom:{...(p.custom||{}),[cid]:v}};patch={custom:{[cid]:v}};}
  else{next={...p,[k]:v};patch={[k]:v};}
  patch.updatedAt=new Date().toISOString();
  S.projects.set(id,next);
  if(S.db)enqueue("p/"+id,()=>S.db.doc("projects/"+id).update(patch));
}

/* ---------- events ---------- */
const grid=$("#gridwrap");
grid.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.k)return;
  const id=el.closest("tr[data-id]").dataset.id;
  let v=el.value;
  if(el.type==="number")v=v===""?null:Number(v);
  else if(el.type==="date")v=v||null;
  else if(typeof v==="string")v=v.trim();
  save(id,el.dataset.k,v);patchRow(id);renderSummary();
  if(["fechaInicio","fechaFin","marca","solicitante","receptor","respOp","respCre","respDis","respAdm","provTecnico","provImpresion"].includes(el.dataset.k))S.pending=true;
});
grid.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending&&!inGrid()){S.pending=false;renderFilters();renderTable();}},0));
grid.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input.in")){e.target.blur();}});
grid.addEventListener("click",e=>{
  const b=e.target.closest("[data-del]");if(!b)return;
  const id=b.closest("tr").dataset.id;
  if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="¿Confirmar?";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Eliminar";}},3000);return;}
  const p=S.projects.get(id);S.projects.delete(id);renderAll();
  if(S.db)enqueue("p/"+id,()=>S.db.doc("projects/"+id).delete());
  toast(`“${p?.proyecto||"Proyecto"}” eliminado`);
});
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(!g)return;
  if(S.view!=="tabla")setView("tabla");
  const go=()=>{const tr=grid.querySelector(`tr[data-id="${CSS.escape(g.dataset.go)}"]`);
    if(!tr){S.f={q:"",mes:"all",marca:"all",resp:"all",alerts:false,past:false};syncFilterInputs();renderAll();return setTimeout(go2,0);}
    focusRow(tr);};
  const go2=()=>{const tr=grid.querySelector(`tr[data-id="${CSS.escape(g.dataset.go)}"]`);if(tr)focusRow(tr);};
  go();
});
function focusRow(tr){tr.scrollIntoView({block:"center",behavior:"smooth"});grid.scrollLeft=0;tr.classList.remove("flash");void tr.offsetWidth;tr.classList.add("flash");}
function syncFilterInputs(){$("#q").value=S.f.q;$("#fAlert").checked=S.f.alerts;$("#fPast").checked=S.f.past;}
let qT;$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{S.f.q=e.target.value.trim();renderAll();},150);});
$("#fMes").addEventListener("change",e=>{S.f.mes=e.target.value;renderAll();});
$("#fMarca").addEventListener("change",e=>{S.f.marca=e.target.value;renderAll();});
$("#fResp").addEventListener("change",e=>{S.f.resp=e.target.value;renderAll();});
$("#fAlert").addEventListener("change",e=>{S.f.alerts=e.target.checked;renderAll();});
$("#fPast").addEventListener("change",e=>{S.f.past=e.target.checked;renderAll();});
function setView(v){S.view=v;$("#tabTabla").setAttribute("aria-pressed",v==="tabla");$("#tabEq").setAttribute("aria-pressed",v==="eq");$("#tabProv").setAttribute("aria-pressed",v==="prov");$("#viewTabla").hidden=v!=="tabla";$("#viewEq").hidden=v!=="eq";$("#viewProv").hidden=v!=="prov";$("#grpToggle").style.visibility=v==="tabla"?"visible":"hidden";renderAll();}
$("#tabTabla").onclick=()=>setView("tabla");$("#tabEq").onclick=()=>setView("eq");$("#tabProv").onclick=()=>setView("prov");
$("#grpToggle").querySelectorAll("button").forEach(b=>{b.setAttribute("aria-pressed",!S.hidden[b.dataset.g]);b.onclick=()=>{S.hidden[b.dataset.g]=!S.hidden[b.dataset.g];b.setAttribute("aria-pressed",!S.hidden[b.dataset.g]);try{localStorage.setItem("kc-hidden",JSON.stringify(S.hidden));}catch(e){}renderTable();};});

$("#btnAdd").onclick=()=>{
  const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const doc={proyecto:"",evento:"",marca:S.f.marca!=="all"?S.f.marca:"",servicio:"",solicitante:"",receptor:"",fechaInicio:null,fechaFin:null,respOp:"",respCre:"",respDis:"",respAdm:"",venue:"Pendiente",concepto:"Pendiente",distribucion:"Pendiente",lookfeel:"Pendiente",pptoEjecEstado:"Pendiente",provTecnico:"",provImpresion:"",ultReunion:null,proxReunion:null,pptoCliente:"Por enviar",odc:"No",factura:"No",montoFactura:null,costosEst:null,notas:"",custom:{},createdAt:new Date().toISOString()};
  S.projects.set(id,{id,...doc});S.f.mes="all";S.f.alerts=false;S.f.q="";syncFilterInputs();S.focusNew=id;
  if(S.view!=="tabla")setView("tabla");else renderAll();
  if(S.db)enqueue("p/"+id,()=>S.db.doc("projects/"+id).set(doc));
};
$("#btnCol").onclick=()=>{const p=$("#colPanel");p.hidden=!p.hidden;if(!p.hidden)$("#cLabel").focus();};
$("#cClose").onclick=()=>$("#colPanel").hidden=true;
function saveCols(){const list=S.custom.map(c=>({...c}));if(S.db)enqueue("cols",()=>S.db.doc("config/columns").set({list}));}
$("#cAdd").onclick=()=>{
  const label=$("#cLabel").value.trim();if(!label){$("#cLabel").focus();return;}
  S.custom=[...S.custom,{id:"c"+Date.now().toString(36),label,type:$("#cType").value,group:$("#cGroup").value}];
  $("#cLabel").value="";saveCols();renderAll();toast(`Columna “${label}” agregada`);
};
$("#cLabel").addEventListener("keydown",e=>{if(e.key==="Enter")$("#cAdd").click();});
$("#cList").addEventListener("click",e=>{
  const b=e.target.closest("[data-cdel]");if(!b)return;
  if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="¿Seguro?";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Quitar";}},3000);return;}
  S.custom=S.custom.filter(c=>c.id!==b.dataset.cdel);saveCols();renderAll();
});

/* ---------- boot ---------- */
const hoy=new Date();$("#today").textContent="Hoy · "+hoy.getDate()+" "+MES3[hoy.getMonth()]+" "+hoy.getFullYear();
renderAll();
let ren=0;function schedule(){cancelAnimationFrame(ren);ren=requestAnimationFrame(renderAll);}
(async()=>{
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  if(!db){S.offline=true;S.loaded=true;setSync("offline","Sin conexión");const b=$("#banner");b.hidden=false;b.textContent="No se pudo conectar con la base compartida (Firebase). Revisa tu internet o la configuración en config.js; los cambios no se guardarán.";renderAll();return;}
  S.db=db;
  try{const u=await window.claude.use("user");const w=u?await u.can("data.write"):null;if(w===false)setReadOnly();}catch(e){}
  db.collection("projects").onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));
    for(const[id,p]of S.projects)if(!m.has(id)&&S.saving>0&&!S.loaded)m.set(id,p);
    S.server=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
    S.projects=m;S.loaded=true;updSync();schedule();
  },err=>{setSync("error","Sin sincronizar");toast("Se perdió la conexión en vivo. Recarga la página.");});
  db.doc("config/columns").onSnapshot(s=>{S.custom=s.exists?((s.data()||{}).list||[]):[];schedule();},()=>{});
})();
})();
</script>
