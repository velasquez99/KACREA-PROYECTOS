<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablero Producción Kacrea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --surface-2:#F7F8F4; --ink:#15171C; --muted:#5D626C; --line:#DCDFD6; --line-2:#E9EBE5;
  --accent:#2D46D6; --accent-soft:#E3E7FF; --accent-ink:#FFFFFF;
  --ok:#1C7F52; --ok-bg:#DBF1E5; --warn:#9A6414; --warn-bg:#FAEED3; --bad:#B8322A; --bad-bg:#FBE2DE; --idle:#6B707A; --idle-bg:#ECEDE8;
  --g-gen:#F4F5F1; --g-eq:#FBF4E6; --g-op:#EEF1FF; --g-adm:#EEF7F1; --g-nt:#F4F5F1;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px -12px rgba(20,24,40,.12);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#171A20; --surface-2:#1C2027; --ink:#ECEEF2; --muted:#9BA1AC; --line:#2B3039; --line-2:#232730;
  --accent:#8497FF; --accent-soft:#222A52; --accent-ink:#0E1120;
  --ok:#52C58F; --ok-bg:#15301F; --warn:#E3AC4E; --warn-bg:#33280F; --bad:#F2766C; --bad-bg:#3A1A18; --idle:#949AA5; --idle-bg:#252930;
  --g-gen:#1A1D23; --g-eq:#262116; --g-op:#1B2033; --g-adm:#18261F; --g-nt:#1A1D23;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#171A20; --surface-2:#1C2027; --ink:#ECEEF2; --muted:#9BA1AC; --line:#2B3039; --line-2:#232730;
  --accent:#8497FF; --accent-soft:#222A52; --accent-ink:#0E1120;
  --ok:#52C58F; --ok-bg:#15301F; --warn:#E3AC4E; --warn-bg:#33280F; --bad:#F2766C; --bad-bg:#3A1A18; --idle:#949AA5; --idle-bg:#252930;
  --g-gen:#1A1D23; --g-eq:#262116; --g-op:#1B2033; --g-adm:#18261F; --g-nt:#1A1D23;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.45 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(26px,3.4vw,38px)/1.05 var(--display);letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.sync.ok i{background:var(--ok)} .sync.saving i{background:var(--warn)} .sync.error i,.sync.offline i{background:var(--bad)}
.today{font:500 12px var(--mono);color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--line-2);overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;background:var(--accent);border-radius:5px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* watch panels */
.watch{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:860px){.watch{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h2{font:600 15px var(--display);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.list{display:flex;flex-direction:column;max-height:228px;overflow:auto;margin:0 -6px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 6px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.li:hover{background:var(--surface-2)}
.li .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:12px;color:var(--muted)}
.li .when{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.sev{width:8px;height:8px;border-radius:50%}
.sev.s3{background:var(--bad)} .sev.s2{background:var(--warn)} .sev.s1{background:var(--idle)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:36px}
.field input,.field select{border:0;background:none;outline:none;height:34px;min-width:0}
.field input{width:180px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;padding:0 4px}
.sp{flex:1}
.btn{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.grp-toggle{display:inline-flex;gap:4px}
.grp-toggle button{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.grp-toggle button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* column panel */
.colpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.colpanel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.colpanel .field input{width:220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font-size:12px}
.cchip span{color:var(--muted);font-family:var(--mono);font-size:11px}
.cchip button{border:0;background:var(--idle-bg);border-radius:99px;padding:2px 8px;cursor:pointer;font-size:11px}
.cchip button.armed{background:var(--bad);color:#fff}

/* grid */
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:78vh;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:0;vertical-align:middle;background:var(--surface)}
thead th{position:sticky;z-index:3;font-weight:600;text-align:left;white-space:nowrap}
thead tr.g th{top:0;height:30px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:0 10px;color:var(--muted)}
thead tr.h th{top:30px;padding:8px 10px;font-size:12px;line-height:1.25;white-space:normal;vertical-align:bottom;box-shadow:0 1px 0 var(--line)}
th.gen,td.gen{background:var(--surface)} thead th.gen{background:var(--g-gen)}
thead th.op{background:var(--g-op)} thead th.eq{background:var(--g-eq)} thead tr.g th.eq{color:var(--warn)} thead th.adm{background:var(--g-adm)} thead th.nt{background:var(--g-nt)}
thead tr.g th.op{color:var(--accent)} thead tr.g th.adm{color:var(--ok)}
.stick{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line)}
thead .stick{z-index:5}
tr.mes td{background:var(--surface-2);font:600 13px var(--display);padding:10px 12px;position:sticky;left:0}
tr.mes td span{font:500 11px var(--mono);color:var(--muted);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
tbody tr.r:hover td,tbody tr.r:hover th{background:var(--surface-2)}
tr.r.flash th,tr.r.flash td{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){tr.r.flash th,tr.r.flash td{animation:none;background:var(--accent-soft)}}

.pj{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 10px;width:350px}
.ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%),var(--line-2) 0);display:grid;place-items:center}
.ring b{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:500 10px var(--mono);font-variant-numeric:tabular-nums}
.pj .in.name{font-weight:600;font-size:14px;width:100%}
.meta{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:0 6px;margin-top:1px;max-width:255px}
.tag{font:500 10.5px var(--mono);padding:1px 6px;border-radius:99px;white-space:nowrap}
.tag.s3{background:var(--bad-bg);color:var(--bad)} .tag.s2{background:var(--warn-bg);color:var(--warn)} .tag.s1{background:var(--idle-bg);color:var(--idle)}

.in{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px;height:32px;outline:none;width:150px}
.in:hover{border-color:var(--line)}
.in:focus{border-color:var(--accent);background:var(--surface)}
.in::placeholder{color:var(--muted);opacity:.55}
td>.in,td>label,td>select,td>.util{margin:4px 6px}
.in-date{width:132px;font-family:var(--mono);font-size:12px}
.in-date.late{color:var(--bad);font-weight:500}
.money{display:inline-flex;align-items:center;gap:2px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.money .in{width:104px;font-family:var(--mono);font-size:12.5px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:99px;padding:5px 24px 5px 10px;font-size:12px;font-weight:500;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;background-size:4px 4px;background-repeat:no-repeat;min-width:104px}
.pill.t-ok{background-color:var(--ok-bg);color:var(--ok)} .pill.t-warn{background-color:var(--warn-bg);color:var(--warn)}
.pill.t-bad{background-color:var(--bad-bg);color:var(--bad)} .pill.t-idle{background-color:var(--idle-bg);color:var(--idle)}
.pill option{background:var(--surface);color:var(--ink)}
.util{display:inline-block;font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:110px;text-align:right;padding:6px}
.util.pos{color:var(--ok)} .util.neg{color:var(--bad)} .util small{color:var(--muted);font-weight:400;margin-left:4px}
.act{padding:0 8px}
.del{border:1px solid transparent;background:none;color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;white-space:nowrap}
.del:hover{border-color:var(--line)}
.del.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.state{padding:40px 16px;text-align:center;color:var(--muted)}

/* suppliers */
.prov{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.prov{grid-template-columns:1fr}}
.pcat{display:flex;flex-direction:column;gap:10px}
.pcat h3{font:600 16px var(--display);margin:0}
.pcat .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.sup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sup .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sup .hd b{font:600 15px var(--display)}
.sup .hd span{font:500 12px var(--mono);color:var(--muted)}
.sup ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sup li{display:grid;grid-template-columns:96px 1fr auto;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);font-size:13px;align-items:center}
.sup li .dt{font:500 12px var(--mono);color:var(--muted)}
.sup.none{border-style:dashed}
.eqsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.eqsum .tag{font-size:12px;padding:4px 10px}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .hd b{font:600 17px var(--display)}
.pcard .hd button{font-size:12px}
.load{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-2);border-radius:8px;overflow:hidden}
.load div{background:var(--surface-2);padding:6px 8px;display:flex;flex-direction:column}
.load div span{font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.load div b{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.role{font:500 11px var(--mono);padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.role.z{background:var(--idle-bg);color:var(--idle)}
.pcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:220px;overflow:auto}
.pcard li{display:grid;grid-template-columns:80px 1fr auto;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);font-size:13px;align-items:center}
.pcard li .dt{font:500 12px var(--mono);color:var(--muted)}
.pcard li .rl{font:500 10.5px var(--mono);color:var(--muted)}
.lbar{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.lbar b{display:block;height:100%;border-radius:6px}
body.ro #btnAdd,body.ro #btnCol,body.ro .del,body.ro #colPanel{display:none!important}
body.ro .in,body.ro .pill{pointer-events:none}
.banner.err{background:var(--bad-bg);color:var(--bad)}
/* indicadores */
.ind{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ind .wide{grid-column:1/-1}
@media (max-width:900px){.ind{grid-template-columns:1fr}}
.ip{display:flex;flex-direction:column;gap:10px}
.ip h2{margin:0}
.ip h3{font:600 13px var(--display);margin:0 0 6px}
.tw{overflow-x:auto}
.mt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.mt th,.mt td{border:0;border-bottom:1px solid var(--line-2);padding:6px 8px;background:none;text-align:left;white-space:nowrap}
.mt thead th{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:static}
.mt tbody th{font-weight:600}
.mt .c{text-align:center}.mt .r{text-align:right}.mt .b{font-weight:600}.mt .m{color:var(--muted)}
.heat td{min-width:40px;border-right:2px solid var(--surface);border-radius:4px;font-weight:600}
.note{font-size:11.5px;color:var(--muted);margin:0}
.hb{flex:1;display:block;height:10px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:40px}
.hb b{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.shr{display:flex;align-items:center;gap:8px;min-width:120px}.shr i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:30px}
.fun,.stk{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.fl{color:var(--ink)}.fv{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:90px}.fv small{color:var(--muted);font-weight:400}
.sb{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden;background:var(--line-2)}
.sg{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.flag{border-radius:8px;padding:8px 12px;font-size:12.5px}.flag.s2{background:var(--warn-bg);color:var(--warn)}.flag.s1{background:var(--idle-bg);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.tiles,.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tiles div{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tiles span{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles b{font:700 20px var(--display);font-variant-numeric:tabular-nums}.tiles small{font-size:11px;color:var(--muted)}
.tbad{color:var(--bad)}.twarn{color:var(--warn)}
.pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pl li{display:grid;grid-template-columns:1fr auto 64px;gap:10px;padding:6px 0;border-top:1px solid var(--line-2);font-size:12.5px;align-items:center}
.pl li small{color:var(--muted)}.pl li b{font:500 12.5px var(--mono)}.pl li i{font:500 12px var(--mono);font-style:normal;text-align:right}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:170px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cv{font:600 11px var(--mono)}.cb{flex:1;width:100%;max-width:26px;display:flex;align-items:flex-end}
.cb b{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.cl{font:500 9.5px var(--mono);color:var(--muted);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:700px){.two{grid-template-columns:1fr}}
.modnav{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.modnav .brand{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:10px}
.modnav a{color:var(--muted);text-decoration:none;font-weight:500;padding:6px 12px;border-radius:8px}
.modnav a:hover{background:var(--surface)}
.navnew{margin-left:auto;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
.navnew:hover{filter:brightness(1.08)}
body.ro .navnew{display:none}
.modnav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
button.sync{cursor:pointer}

const STEPS=[["team","team"],["venue","s"],["concepto","s"],["distribucion","s"],["lookfeel","s"],["pptoEjecEstado","s"],["provTecnico","t"],["provImpresion","t"]];

const $=s=>document.querySelector(s);

const now=new Date();

const T0=Date.parse(TODAY+"T00:00:00");
const daysTo=iso=>iso?Math.round((Date.parse(iso+"T00:00:00")-T0)/864e5):null;
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("es-VE");
const num=v=>typeof v==="number"&&isFinite(v)?v:null;
function dLabel(iso){if(!iso)return "";const[y,m,d]=iso.split("-");return `${d} ${MES3[+m-1]}`;}
function rangeLabel(p){const a=p.fechaInicio,b=p.fechaFin;if(!a)return "Fecha por definir";if(!b||b===a)return dLabel(a);
  const[,ma,da]=a.split("-"),[,mb,db]=b.split("-");return ma===mb?`${da}–${db} ${MES3[+ma-1]}`:`${dLabel(a)} – ${dLabel(b)}`;}

const isPast=p=>!!endOf(p)&&endOf(p)<TODAY;
function getVal(p,k){if(k.startsWith("sh."))return shVal(p,k);
  if(k.startsWith("area."))return areaResp(p,k.slice(5));

function progress(p){let d=0;for(const[k,t]of STEPS){const v=p[k];if(t==="team"){if(teamReady(p))d++;continue;}if(t==="t"?(v&&String(v).trim()):(v==="Listo"||v==="N/A"))d++;}return {done:d,pct:Math.round(d/STEPS.length*100)};}
/* ---------- Hoja maestra (Google Sheets, solo lectura) ---------- */
const SHEET_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSTPL2nRtCfahaZtNWC2fkEAZRaJ-rwvZl8ZI2_dbilNhfGW34MddrrG72obS50lyis1P8NsMFlGtIs/pub?gid=989528746&single=true&output=csv";
const SHEET_APPS="https://script.google.com/macros/s/AKfycbze9phxDf-p3J3hHOXTGM_o7dA88GYJhTr6MhqNKiZhf7SkqdT-ZPOF8RwFEjN_1Ure/exec";
const SH={byId:new Map(),loaded:false,err:null,at:null};
const ESTADO_ORD=["Aprobado","Enviado - Pendiente A. C.","En Revisión Interna","Por Elaboración","Proceso de Licitación","Pausado","Rechazado"];
function pMonto(v){const n=parseFloat(String(v||"").replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;}
function pFecha(v){const m=String(v||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:null;}
async function loadSheet(){
  if(typeof Papa==="undefined"){SH.err="sin lector";return;}
  let txt=null;
  for(const u of [SHEET_CSV,SHEET_APPS,"https://corsproxy.io/?"+encodeURIComponent(SHEET_CSV)]){
    try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),15000);const r=await fetch(u,{signal:ctl.signal,cache:"no-store"});clearTimeout(tm);if(!r.ok)throw 0;const t=await r.text();if(t&&t.length>10&&!(t.trim().startsWith("<")&&!t.includes(","))){txt=t;break;}}catch(e){}
  }
  if(!txt){SH.err="No se pudo leer la hoja maestra";schedule();return;}
  const rows=Papa.parse(txt,{header:true,skipEmptyLines:true}).data;const g=new Map();
  for(const r of rows){const id=(r["ID_Proyecto"]||"").trim();if(!id)continue;if(!g.has(id))g.set(id,[]);g.get(id).push(r);}
  const by=new Map();
  for(const [id,l] of g){
    const f=k=>(l.find(r=>(r[k]||"").trim())||{})[k]||"";
    const est=[...new Set(l.map(r=>(r["Estatus de PPTO"]||"").trim()).filter(Boolean))];
    const estado=ESTADO_ORD.find(e=>est.includes(e))||est[0]||"Sin estatus";
    const apr=l.filter(r=>(r["Estatus de PPTO"]||"").trim()==="Aprobado");
    const montoApr=apr.reduce((s,r)=>s+pMonto(r["Monto PPTO ($) (Sin IVA)"])+pMonto(r["Monto por diferencial Cambiario"]),0);
    const montoPpto=l.reduce((s,r)=>s+pMonto(r["Monto PPTO ($) (Sin IVA)"]),0);
    const facturado=l.some(r=>(r["Estatus de Facturación"]||"").trim()==="Facturado");
    const ff=l.map(r=>pFecha(r["Fecha de Facturación"])).filter(Boolean).sort();
    const fc=l.map(r=>pFecha(r["Fecha de Cobro"])).filter(Boolean).sort();
    by.set(id,{id,cliente:f("Cliente").trim(),proyecto:f("Proyecto").trim(),depto:f("Departamento").trim(),servicio:[...new Set(l.map(r=>(r["Servicio"]||"").trim()).filter(Boolean))].join(", "),
      canalInt:f("Canal de Contacto Interno").trim(),canalExt:f("Canal de Contacto Externo").trim(),fechaSol:(l.map(r=>pFecha(r["Fecha de Solicitud"])).filter(Boolean).sort()[0])||null,estado,montoApr,montoPpto,facturado,fechaFact:ff[0]||null,
      cobrado:l.reduce((s,r)=>s+pMonto(r["Monto Cobrado"]),0),fechaCobro:fc[fc.length-1]||null,estProy:f("Estatus del Proyecto").trim()});
  }
  SH.byId=by;SH.loaded=true;SH.err=null;SH.at=new Date();schedule();
}
const shOf=p=>p&&p.idHoja?SH.byId.get(String(p.idHoja).trim().toUpperCase())||null:null;
function shVal(p,k){const h=shOf(p);if(!h)return null;return h[k.slice(3)];}
const OVR={"sh.estado":["pptoM","estado","sel"],"sh.montoApr":["ingresoM","montoApr","money"],
  "sh.fact":["factM","facturado","yn"],"sh.cobrado":["cobradoM","cobrado","money"],
  "sh.fechaSol":["fechaSolM","fechaSol","date"],"sh.canalExt":["canalExtM","canalExt","text"],

/* Valor efectivo de una celda que también vive en la hoja maestra.

function ovr(p,ck){const [mk,hk,t]=OVR[ck];const m=p?p[mk]:null;

function ovrTag(o){
  if(o.has)return `<i class="mtag man" title="Escrito a mano. Manda sobre la hoja maestra.">mano<button type="button" class="ox" data-clrovr="${esc(o.mk)}" title="Volver al dato de la hoja">×</button></i>`;

function sheetCell(p,k){
  if(!OVR[k]){const h=shOf(p);return `<span class="shc${h?"":" m"}">${h?esc(h[k.slice(3)]||"—"):(p.idHoja?(SH.loaded?"ID no encontrado":"…"):"—")}</span>`;}

    const ph=(o.hv!==null&&o.hv!==undefined)?String(Math.round(o.hv)):"0";

function cierreSteps(p){
  const est=ovr(p,"sh.estado"),fac=ovr(p,"sh.fact"),cob=ovr(p,"sh.cobrado");
  const ing=fin(p).ing,c=num(cob.val)||0;
  return [
   {l:"PPTO enviado al cliente",ok:ENVIADO.has(String(est.val||"")),auto:est.has?0:1},
   {l:"PPTO aprobado",ok:est.val==="Aprobado",auto:est.has?0:1},

   {l:"Evento ejecutado",ok:isPast(p),auto:1},
   {l:"Facturado",ok:fac.val==="Sí"||fac.val===true,auto:fac.has?0:1},
   {l:"Cobrado",ok:ing>0&&c>=ing-1,auto:cob.has?0:1},
   {l:"Cierre administrativo (costos e informe)",ok:p.cierreAdm==="Sí"}];}

/* Ingreso en $, pérdida al cambiar bolívares a dólares, costos y utilidad real */
function fin(p){
  const o=ovr(p,"sh.montoApr");const ing=num(o.val)||0;const manual=o.has||!shOf(p);
  const pct=num(p.perdidaPct)!==null?num(p.perdidaPct):(num(S.cfg&&S.cfg.perdidaPct)!==null?num(S.cfg.perdidaPct):15);
  const perd=ing*pct/100,neto=ing-perd;
  const cost=num(p.costosReal)!==null?num(p.costosReal):num(p.costosEst);
  const util=(ing>0&&cost!==null)?neto-cost:null;
  return {ing,manual,pct,perd,neto,cost,util,mg:(util!==null&&ing>0)?util/ing*100:null};
}
function util(p){const f=fin(p);return f.util===null?null:{u:f.util,mg:f.mg||0};}
function alertsOf(p){
  const out=[],d=daysTo(p.fechaInicio),pr=progress(p).pct,past=isPast(p);
  if(isCancel(p))return out;
  if(!past){const sr=activeAreas(p).filter(a=>!people(a.resp).length);
    if(sr.length)out.push({s:(d!==null&&d<=14)?2:1,t:`Sin responsable: ${sr.map(a=>a.l).join(", ")}`});}
  if(!past){
    if(d!==null&&d<=7&&pr<100)out.push({s:3,t:d<=0?`En curso · avance ${pr}%`:`Faltan ${d} días · avance ${pr}%`});
    else if(d!==null&&d<=21&&pr<60)out.push({s:2,t:`Evento en ${d} días · avance ${pr}%`});

    {const h=shOf(p);if(h&&d!==null&&d<=14&&h.estado!=="Aprobado")out.push({s:3,t:`PPTO ${h.estado.toLowerCase()} a ${Math.max(d,0)} días`});}

  }

/* ---------- Vocabulario, sugerencias y nombres repetidos ---------- */
const norm=v=>String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/\b(c\.?\s?a\.?|s\.?\s?a\.?|s\.?r\.?l\.?|rif|inc|ltd)\b/g," ").replace(/[^a-z0-9]+/g," ").trim();
const splitProv=v=>String(v||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean);
const splitFor=(kind,v)=>kind==="prov"?splitProv(v):people(v);
function lev(a,b){if(a===b)return 0;const m=a.length,q=b.length;if(!m||!q)return m||q;
  let prev=[...Array(q+1).keys()],cur=new Array(q+1);
  for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=q;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));const t=prev;prev=cur;cur=t;}
  return prev[q];}
function vocabOf(kind){
  const raw=new Map();
  for(const p of S.projects.values()){
    const vals=kind==="prov"?[...splitProv(p.provTecnico),...splitProv(p.provImpresion)]
                            :[...teamOf(p).map(t=>t.n),...ents(p).flatMap(e=>people(e.r))];
    for(const v of vals)if(v)raw.set(v,(raw.get(v)||0)+1);}
  const g=new Map();
  for(const [v,c] of raw){const k=norm(v);if(!k)continue;
    if(!g.has(k))g.set(k,{key:k,variants:new Map(),total:0});
    const e=g.get(k);e.variants.set(v,(e.variants.get(v)||0)+c);e.total+=c;}
  for(const e of g.values())e.canon=bestForm([...e.variants.entries()]);
  return g;}
function formScore(v,c){const mixed=v!==v.toUpperCase()&&v!==v.toLowerCase();
  const cap=/^[A-ZÁÉÍÓÚÑ]/.test(v);const acc=/[áéíóúñÁÉÍÓÚÑ]/.test(v);
  return c*100+(mixed?30:0)+(cap?15:0)+(acc?5:0)+Math.min(v.length,40)/100;}
function bestForm(entries){return entries.slice().sort((a,b)=>formScore(b[0],b[1])-formScore(a[0],a[1])||a[0].localeCompare(b[0],"es"))[0][0];}
const VOC={prov:null,people:null,dirty:true};
function voc(kind){if(VOC.dirty){VOC.prov=vocabOf("prov");VOC.people=vocabOf("people");VOC.dirty=false;}return VOC[kind];}
function canonize(kind,val){const g=voc(kind);
  const out=[],seen=new Set();
  for(const t of splitFor(kind,val)){const e=g.get(norm(t));const v=e?e.canon:t;const k=norm(v);if(k&&seen.has(k))continue;seen.add(k);out.push(v);}
  return out.join(", ");}
function dupGroups(kind){
  const g=voc(kind),ks=[...g.keys()];
  const par=new Map(ks.map(k=>[k,k]));
  const find=k=>{while(par.get(k)!==k)k=par.get(k);return k;};
  const uni=(a,b)=>{const ra=find(a),rb=find(b);if(ra!==rb)par.set(ra,rb);};
  for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){
    const a=ks[i],b=ks[j];if(Math.min(a.length,b.length)<4)continue;
    if((a.length>5&&b.length>5&&lev(a,b)<=2)||a.startsWith(b+" ")||b.startsWith(a+" "))uni(a,b);}
  const cl=new Map();
  for(const k of ks){const r=find(k);if(!cl.has(r))cl.set(r,[]);cl.get(r).push(k);}
  const out=[];
  for(const keys of cl.values()){
    const vs=new Map();let total=0;
    for(const k of keys){const e=g.get(k);total+=e.total;for(const [v,c] of e.variants)vs.set(v,(vs.get(v)||0)+c);}
    if(vs.size<2)continue;
    const variants=[...vs.entries()].sort((a,b)=>b[1]-a[1]);
    out.push({canon:bestForm(variants),variants,total});}
  return out.sort((a,b)=>b.total-a.total);}
function mergeName(kind,variants,canon){
  const from=new Set(variants.map(norm));
  const fix=val=>{const parts=splitFor(kind,val);if(!parts.length)return null;
    let ch=false;const out=[],seen=new Set();
    for(const t of parts){let v=t;if(from.has(norm(t))&&t!==canon){v=canon;ch=true;}
      const k=norm(v);if(seen.has(k)){ch=true;continue;}seen.add(k);out.push(v);}
    return ch?out.join(", "):null;};
  let c=0;
  for(const p of [...S.projects.values()]){
    if(kind==="prov"){for(const k of ["provTecnico","provImpresion"]){const nv=fix(p[k]);if(nv!==null){save(p.id,k,nv);c++;}}}
    else{
      for(const [ak] of AREAS){const cur=areaResp(p,ak);if(!cur)continue;const nv=fix(cur);if(nv!==null){save(p.id,"area."+ak,{on:areaOn(p,ak),resp:nv});c++;}}
      for(const k of ["respAdm","respOp","respCre","respDis"]){const nv=fix(p[k]);if(nv!==null){save(p.id,k,nv);c++;}}
      const E=ents(p);let ch=false;const E2=E.map(e=>{const nv=fix(e.r);if(nv!==null){ch=true;return {...e,r:nv};}return e;});
      if(ch){save(p.id,"entregables",E2);c++;}}}
  VOC.dirty=true;return c;}
const DUPS={prov:[],people:[]};
function dupCard(kind){
  const gs=dupGroups(kind);DUPS[kind]=gs;
  const que=kind==="prov"?"proveedores":"responsables";
  if(!gs.length)return `<div class="dupc okc">No hay ${que} escritos de dos formas distintas.</div>`;
  return `<div class="dupc"><h4>Parecen el mismo ${kind==="prov"?"proveedor":"responsable"} escrito distinto <small>${gs.length}</small></h4>
  <p class="note" style="margin:2px 0 4px">Elige cómo debe quedar el nombre y unifícalo en todos los proyectos de una vez.</p>
  ${gs.map((g,i)=>`<div class="dupg"><div class="dupv">${g.variants.map(([v,c])=>`<span class="nch">${esc(v)} <i>${c}</i></span>`).join("")}</div>
    <div class="dupa"><select data-dupsel="${kind}-${i}" aria-label="Nombre correcto">${g.variants.map(([v])=>`<option${v===g.canon?" selected":""}>${esc(v)}</option>`).join("")}</select>
    <button class="btn sm" data-dupmerge="${kind}" data-dupi="${i}">Unificar</button></div></div>`).join("")}</div>`;}
document.addEventListener("click",e=>{const b=e.target.closest("[data-dupmerge]");if(!b)return;

/* --- caja de sugerencias --- */
const SUG={el:null,input:null,items:[],idx:-1};
function sugEl(){if(!SUG.el){const d=document.createElement("div");d.className="sugbox";d.hidden=true;document.body.appendChild(d);SUG.el=d;
  d.addEventListener("mousedown",ev=>{const b=ev.target.closest("[data-sugv]");if(!b)return;ev.preventDefault();applySug(b.dataset.sugv);});}
 return SUG.el;}
function tokenAt(inp){const v=inp.value,cut=v.lastIndexOf(",");return {pre:v.slice(0,cut+1),tok:v.slice(cut+1).trim()};}
function sugItems(kind,tok,used){
  const g=voc(kind),q=norm(tok),all=[...g.values()].filter(e=>!used.has(e.key));
  const mk=(e,w)=>({v:e.canon,t:w?"¿quisiste decir?":e.total+(e.total===1?" proyecto":" proyectos"),w});
  if(!q)return all.sort((a,b)=>b.total-a.total).slice(0,8).map(e=>mk(e,0));
  const A=[],B=[],C=[];
  for(const e of all){const k=e.key;
    if(k.startsWith(q))A.push(e);else if(k.includes(q))B.push(e);
    else if(q.length>=4&&lev(q,k)<=2)C.push(e);}
  const by=(x,y)=>y.total-x.total;
  return [...A.sort(by).map(e=>mk(e,0)),...B.sort(by).map(e=>mk(e,0)),...C.sort(by).map(e=>mk(e,1))].slice(0,8);}
function showSug(inp){
  const kind=inp.dataset.sug;if(!kind)return hideSug();
  const {tok}=tokenAt(inp);
  const used=new Set(splitFor(kind,inp.value).map(norm));used.delete(norm(tok));
  const items=sugItems(kind,tok,used);
  const g=voc(kind),ex=tok?g.get(norm(tok)):null;
  const warn=(ex&&ex.canon!==tok)?`<div class="sugw" data-sugv="${esc(ex.canon)}">Ya está registrado como <b>${esc(ex.canon)}</b> — clic para usar esa forma</div>`:"";
  if(!items.length&&!warn)return hideSug();
  const d=sugEl();SUG.input=inp;SUG.items=items;SUG.idx=-1;
  d.innerHTML=warn+items.map((x,i)=>`<div class="sugi" data-sugv="${esc(x.v)}" data-i="${i}"><b>${esc(x.v)}</b><small>${esc(x.t)}</small></div>`).join("")
    +(tok&&!ex?`<div class="sugn">Enter guarda «${esc(tok)}» como nombre nuevo</div>`:"");
  d.hidden=false;placeSug();}
function placeSug(){const d=SUG.el,inp=SUG.input;if(!d||!inp||d.hidden)return;
  const r=inp.getBoundingClientRect();
  if(r.bottom<-4||r.top>innerHeight+4||r.right<0||r.left>innerWidth){hideSug();return;}
  const w=Math.max(r.width,240),h=d.offsetHeight||180,below=innerHeight-r.bottom;
  const top=(below<h+12&&r.top>h+12)?(r.top-h-4):(r.bottom+4);
  d.style.left=Math.max(8,Math.min(r.left,innerWidth-w-10))+"px";
  d.style.top=Math.max(8,Math.min(top,innerHeight-h-8))+"px";
  d.style.width=w+"px";}
function hideSug(){if(SUG.el)SUG.el.hidden=true;SUG.input=null;SUG.idx=-1;}
function applySug(v){const inp=SUG.input;if(!inp)return;const {pre}=tokenAt(inp);
  inp.value=(pre?pre.replace(/\s*$/," "):"")+v;hideSug();
  inp.dispatchEvent(new Event("change",{bubbles:true}));
  inp.focus();inp.value=inp.value+", ";
  try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){}
  showSug(inp);}
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.sug)showSug(el);},true);
document.addEventListener("focusin",e=>{const el=e.target;if(el.dataset&&el.dataset.sug)showSug(el);else hideSug();});
document.addEventListener("keydown",e=>{if(!SUG.input||!SUG.el||SUG.el.hidden)return;const n=SUG.items.length;
  const paint=()=>[...SUG.el.querySelectorAll(".sugi")].forEach((x,i)=>x.classList.toggle("on",i===SUG.idx));
  if(e.key==="ArrowDown"&&n){e.preventDefault();SUG.idx=SUG.idx+1>=n?0:SUG.idx+1;paint();}
  else if(e.key==="ArrowUp"&&n){e.preventDefault();SUG.idx=SUG.idx-1<0?n-1:SUG.idx-1;paint();}
  else if(e.key==="Enter"&&SUG.idx>=0){e.preventDefault();applySug(SUG.items[SUG.idx].v);}
  else if(e.key==="Escape"){hideSug();}},true);
window.addEventListener("scroll",placeSug,true);
window.addEventListener("resize",placeSug);

function cellHTML(c,p){

function cellHTML0(c,p){

function patchRow(id){
  const tr=$("#gridwrap").querySelector(`tr[data-id="${CSS.escape(id)}"]`);const p=S.projects.get(id);if(!tr||!p)return;

const DAY=864e5;
function monday(iso){const d=new Date(iso+"T00:00:00");const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d;}
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function weeks(n){const out=[];const m=monday(TODAY);for(let i=0;i<n;i++){const a=new Date(m.getTime()+i*7*DAY),b=new Date(a.getTime()+6*DAY);out.push({a:isoOf(a),b:isoOf(b),lab:`${a.getDate()} ${MES3[a.getMonth()]}`});}return out;}
const inWeek=(p,w)=>p.fechaInicio&&p.fechaInicio<=w.b&&endOf(p)>=w.a;
const diffD=(a,b)=>a&&b?Math.round((Date.parse(b+"T00:00:00")-Date.parse(a+"T00:00:00"))/DAY):null;
const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):null;
const pct=(a,b)=>b?Math.round(a/b*100):null;
const sum=(l,f)=>l.reduce((s,p)=>s+(num(f(p))||0),0);
function heat(v,max){if(!v)return "";const t=Math.min(1,v/Math.max(max,1));return `background:color-mix(in srgb,var(--accent) ${Math.round(18+t*62)}%,var(--surface));color:${t>.55?"var(--accent-ink)":"var(--ink)"}`;}
function hbar(v,max,tone){const w=max?Math.max(2,Math.round(v/max*100)):0;return `<span class="hb"><b style="width:${v?w:0}%;${tone?`background:var(--${tone})`:""}"></b></span>`;}

  return `<button class="nent ${cls}" data-open="${esc(p.id)}" title="Abrir ficha">${esc(e.t)}<small>${e.f?dLabel(e.f)+" · "+whenLabel(e.f):"sin fecha"}${e.r?" · "+esc(e.r):""}</small></button>`;}
const hasNextStep=p=>(p.proxReunion&&p.proxReunion>=TODAY)||pendEnts(p).some(e=>!e.f||e.f>=TODAY);

function agendaItems(list){
  const it=[];
  for(const p of list){
    if(p.proxReunion)it.push({d:p.proxReunion,k:"reu",p,t:p.temaReunion||"Reunión de seguimiento",r:p.respOp||""});
    for(const e of pendEnts(p))it.push({d:e.f||null,k:"ent",p,t:e.t,r:e.r||"",eid:e.id});
    if(p.fechaMontaje&&p.fechaMontaje>=TODAY)it.push({d:p.fechaMontaje,k:"mon",p,t:"Montaje",r:p.respOp||""});

  const list=filtered(true).filter(p=>!isCancel(p)&&(!isPast(p)||ents(p).some(e=>!e.ok)));
  const it=agendaItems(list).sort((a,b)=>(a.d||"9").localeCompare(b.d||"9")||a.k.localeCompare(b.k));
  const m=monday(TODAY);const endW=isoOf(new Date(m.getTime()+6*DAY)),endNW=isoOf(new Date(m.getTime()+13*DAY));
  const tomorrow=isoOf(new Date(Date.parse(TODAY+"T00:00:00")+DAY));
  const B=[["Vencido — ponerse al día",x=>x.d&&x.d<TODAY,"bad",1],["Hoy",x=>x.d===TODAY,"acc",1],["Mañana",x=>x.d===tomorrow,"",1],["Resto de esta semana",x=>x.d>tomorrow&&x.d<=endW,"",0],["Próxima semana",x=>x.d>endW&&x.d<=endNW,"",0],["Más adelante",x=>x.d>endNW,"",0],["Entregables sin fecha",x=>!x.d,"warn",0]];

/* ---------- writes ---------- */
const chains=new Map();
function enqueue(key,fn){
  S.saving++;updSync();
  const run=()=>fn().catch(async e=>{if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn();}throw e;});
  const next=(chains.get(key)||Promise.resolve()).then(run).catch(e=>{console.warn(e);
    if(e&&e.code==="invalid_argument")setReadOnly("Tu cambio NO se guardó: tu acceso a este tablero es de solo lectura. Pídele al dueño del tablero acceso de edición; mientras tanto, el tablero queda bloqueado para que no se pierda más trabajo.");
    else if(e&&e.code==="quota_exceeded")toast("Se alcanzó el límite de registros del tablero.");
    else{setSync("error","Cambios sin guardar");const b=$("#banner");b.hidden=false;b.className="banner err";b.textContent="Un cambio no se pudo guardar (conexión). Recarga la página y verifica que tu último dato siga ahí antes de continuar.";}
  }).finally(()=>{S.saving--;updSync();});
  chains.set(key,next);return next;
}
function save(id,k,v){
  if(S.ro)return;
  const p=S.projects.get(id);if(!p)return;
  if(k.startsWith("area.")){const ak=k.slice(5);const cur=areaObj(p)[ak]||{};
    const on=typeof v==="object"?!!v.on:(areaOn(p,ak)||!!String(v||"").trim());
    const resp=typeof v==="object"?(v.resp!==undefined?v.resp:areaResp(p,ak)):v;
    const entry={on,resp};
    S.projects.set(id,{...p,areas:{...areaObj(p),[ak]:entry}});
    VOC.dirty=true;
    if(S.db)enqueue("p/"+id,()=>S.db.doc("projects/"+id).update({areas:{[ak]:entry},updatedAt:new Date().toISOString()}));
    return;}
  let next,patch;
  if(k.startsWith("custom.")){const cid=k.slice(7);next={...p,custom:{...(p.custom||{}),[cid]:v}};patch={custom:{[cid]:v}};}
  else{next={...p,[k]:v};patch={[k]:v};}
  patch.updatedAt=new Date().toISOString();
  S.projects.set(id,next);
  VOC.dirty=true;
  if(S.db)enqueue("p/"+id,()=>S.db.doc("projects/"+id).update(patch));
}

  if(S.db)enqueue("p/"+id,()=>S.db.doc("projects/"+id).set(doc));
  renderAll();return id;
}
function openNew(){
  D.id=null;const el=$("#drawer");const marcas=[...new Set([...S.projects.values()].map(p=>p.marca).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  el.innerHTML=`<div class="dr-h"><div></div><div class="dr-tt"><div class="eyebrow">Acceso rápido</div><h2>Nuevo proyecto</h2><div class="note">Con el nombre basta para crearlo. Lo demás lo puedes completar luego en su ficha.</div></div><button class="dr-x" id="drClose" aria-label="Cerrar">✕</button></div>
  <form class="dr-b" id="newForm">
    <section><h3>Datos del proyecto</h3><div class="dg">
      <label class="df full"><span>Nombre del proyecto *</span><input class="in" id="nf_proyecto" required placeholder="Ej. Lanzamiento PAN Integral – Evento"></label>
      <label class="df"><span>Marca / cliente</span><input class="in" id="nf_marca" list="dl-nfmarca" placeholder="Ej. Pepsi"></label>
      <label class="df"><span>Evento / ocasión</span><input class="in" id="nf_evento" placeholder="Ej. Encendido de Bella Vista"></label>
      <label class="df"><span>ID hoja maestra</span><input class="in" id="nf_idHoja" list="dl-hoja" placeholder="KAC-26… (si ya existe)"></label>
      <label class="df"><span>Fase</span><select class="pill t-idle" id="nf_fase">${FASES.map(f=>`<option>${f}</option>`).join("")}</select></label>
    </div><datalist id="dl-nfmarca">${marcas.map(m=>`<option value="${esc(m)}">`).join("")}</datalist></section>
    <section><h3>Fechas</h3><div class="dg">
      <label class="df"><span>Evento desde</span><input class="in in-date" type="date" id="nf_fechaInicio"></label>
      <label class="df"><span>Evento hasta</span><input class="in in-date" type="date" id="nf_fechaFin"></label>
      <label class="df"><span>Próxima reunión</span><input class="in in-date" type="date" id="nf_proxReunion"></label>
    </div></section>
    <section><h3>Áreas de servicio</h3><p class="note">Marca las que participan; los responsables se asignan luego en la ficha.</p>
      <div class="areas-grid">${AREAS.map(([k,l])=>`<label class="ar"><input type="checkbox" id="nfa_${k}"><span class="arl">${l}</span></label>`).join("")}</div>
    </section>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="submit">Crear y abrir ficha</button><button class="btn" type="button" id="nfCancel">Cancelar</button></div>
  </form>`;
  $("#drawer").hidden=false;$("#drawerOv").hidden=false;document.body.classList.add("dopen");
  setTimeout(()=>{const i=$("#nf_proyecto");if(i)i.focus();},50);
}
$("#btnAdd").onclick=openNew;

$("#cfgPerd").addEventListener("change",e=>{const v=num(e.target.value);const pct=v===null?15:Math.max(0,Math.min(100,v));S.cfg={...S.cfg,perdidaPct:pct};e.target.value=pct;
  if(S.db)enqueue("cfg",()=>S.db.doc("config/settings").set({perdidaPct:pct}));renderAll();});
$("#shBtn").onclick=()=>{SH.err=null;SH.loaded=false;renderShStatus();loadSheet();};
$("#btnCsv").onclick=()=>{
  const cols=[...COLS.filter(c=>c.type!=="calc"),...S.custom.map(c=>({key:"custom."+c.id,label:c.label}))];
  const q=v=>{v=v==null?"":String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[["ID","Proyecto",...cols.map(c=>c.label),"Utilidad neta est.","Avance operativo %"].map(q).join(";")];
  for(const p of sorted([...S.projects.values()])){const u=util(p);rows.push([p.id,p.proyecto,...cols.map(c=>getVal(p,c.key)),u?Math.round(u.u):"",progress(p).pct].map(q).join(";"));}
  const blob=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`respaldo-proyectos-kacrea-${TODAY}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast("Respaldo descargado");
};
$("#btnCol").onclick=()=>{const p=$("#colPanel");p.hidden=!p.hidden;if(!p.hidden)$("#cLabel").focus();};
$("#cClose").onclick=()=>$("#colPanel").hidden=true;
function saveCols(){const list=S.custom.map(c=>({...c}));if(S.db)enqueue("cols",()=>S.db.doc("config/columns").set({list}));}
$("#cAdd").onclick=()=>{
  const label=$("#cLabel").value.trim();if(!label){$("#cLabel").focus();return;}
  S.custom=[...S.custom,{id:"c"+Date.now().toString(36),label,type:$("#cType").value,group:$("#cGroup").value}];
  $("#cLabel").value="";saveCols();renderAll();toast(`Columna “${label}” agregada`);
};
$("#cLabel").addEventListener("keydown",e=>{if(e.key==="Enter")$("#cAdd").click();});
$("#cList").addEventListener("click",e=>{
  const b=e.target.closest("[data-cdel]");if(!b)return;
  if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="¿Seguro?";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Quitar";}},3000);return;}
  S.custom=S.custom.filter(c=>c.id!==b.dataset.cdel);saveCols();renderAll();
});

/* ---------- boot ---------- */
const hoy=new Date();$("#today").textContent="Hoy · "+hoy.getDate()+" "+MES3[hoy.getMonth()]+" "+hoy.getFullYear();
renderAll();
initDrawer();setView("agenda");$("#navNew").onclick=openNew;initSys();window.addEventListener("hashchange",route);route();
loadSheet();setInterval(loadSheet,5*60*1000);
let ren=0;function schedule(){cancelAnimationFrame(ren);ren=requestAnimationFrame(renderAll);}
(async()=>{
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  if(!db){S.offline=true;S.loaded=true;setSync("offline","Sin conexión");const b=$("#banner");b.hidden=false;b.textContent="No se pudo conectar con la base compartida (Firebase). Revisa tu internet o la configuración en config.js; los cambios no se guardarán.";renderAll();return;}
  S.db=db;
  try{const u=await window.claude.use("user");const w=u?await u.can("data.write"):null;if(w===false)setReadOnly();}catch(e){}
  db.collection("projects").onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));
    for(const[id,p]of S.projects)if(!m.has(id)&&S.saving>0&&!S.loaded)m.set(id,p);
    S.server=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
    S.projects=m;S.loaded=true;updSync();schedule();
  },err=>{setSync("error","Sin sincronizar");toast("Se perdió la conexión en vivo. Recarga la página.");});
  db.doc("config/settings").onSnapshot(s2=>{const d=s2.exists?(s2.data()||{}):{};S.cfg={perdidaPct:num(d.perdidaPct)!==null?num(d.perdidaPct):15};const i=$("#cfgPerd");if(i&&i!==document.activeElement)i.value=S.cfg.perdidaPct;schedule();},()=>{});
  db.doc("config/columns").onSnapshot(s=>{S.custom=s.exists?((s.data()||{}).list||[]):[];schedule();},()=>{});
})();
})();
</script>
